# render.yaml — Infrastructure-as-Code for Render.com free tier
# Commit this file to the root of your repository.
# Go to https://dashboard.render.com → New → Blueprint → connect this repo.
# Render will create all three services and link them automatically.
#
# FREE TIER NOTES:
#  - Web Services spin down after 15 min of inactivity (cold-start ~30s).
#  - PostgreSQL free plan expires after 90 days; upgrade or export data before then.
#  - Static Sites are always-on and free with no spin-down.

services:
  # ── 1. API (Web Service) ───────────────────────────────────────────────────
  - type: web
    name: codity-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ""           # Dockerfile CMD handles migrate + start
    dockerTarget: api           # Multi-stage: build only the `api` stage
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codity-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set CORS_ORIGIN to the Render URL of the Static Site once it's deployed.
      # You can update this in the Render dashboard without redeploying.
      - key: CORS_ORIGIN
        value: https://codity-dashboard.onrender.com
      - key: FRONTEND_URL
        value: https://codity-dashboard.onrender.com
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "200"

  # ── 2. Worker (Background Worker) ─────────────────────────────────────────
  - type: worker
    name: codity-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerTarget: worker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Worker calls the API on the same Render private network
      - key: API_URL
        value: https://codity-api.onrender.com/api/v1
      - key: CONCURRENCY
        value: "3"
      # WORKER_API_KEY: set manually in Render dashboard after running db:seed
      - key: WORKER_API_KEY
        sync: false
      # QUEUE_ID: set manually in Render dashboard after seeding
      - key: QUEUE_ID
        sync: false

  # ── 3. Dashboard (Static Site) ────────────────────────────────────────────
  # Render Static Sites serve directly from a dist/ directory — no Docker needed.
  - type: web
    name: codity-dashboard
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w packages/dashboard
    staticPublishPath: packages/dashboard/dist
    plan: free
    routes:
      # SPA fallback: any path that doesn't match a file serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      # Leave VITE_API_URL empty so the browser uses the relative /api/v1 path
      # which Render Static Sites will proxy to the API service via the rewrite above.
      # OR set it to the full API URL if you need cross-origin requests.
      - key: VITE_API_URL
        value: https://codity-api.onrender.com/api/v1

databases:
  # ── PostgreSQL (free plan) ──────────────────────────────────────────────────
  - name: codity-db
    plan: free
    databaseName: codity
    user: codity
