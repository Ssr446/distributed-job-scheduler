<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded square background matching accent-primary in dark mode -->
  <rect width="32" height="32" rx="7" fill="#e307b0"/>
  <!-- Subtle white overlay matching the login logo's bg-white/10 layer -->
  <rect width="32" height="32" rx="7" fill="white" fill-opacity="0.1"/>
  <!-- Lucide "Layers" icon, centered, scaled to fit inside the 32x32 box -->
  <!-- Original Lucide Layers viewBox is 24x24; scaled to 20x20, offset by (6,6) -->
  <g transform="translate(6,6)" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top diamond (the "top layer" shape in Lucide Layers) -->
    <polygon points="10,1 19,5.5 10,10 1,5.5"/>
    <!-- Middle stagger line -->
    <polyline points="1,10 10,14.5 19,10"/>
    <!-- Bottom stagger line -->
    <polyline points="1,14.5 10,19 19,14.5"/>
  </g>
</svg>
